<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatCam · Gallery</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#172720;--muted:#65766d;--line:#dce7df;--green:#176c3d;--soft:#e6f2e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#111b17;--card:#1c2922;--ink:#eef5ef;--muted:#afc0b6;--line:#35463c;--green:#57b982;--soft:#273e30}a{color:var(--green)}button,select,input{font:inherit}button{cursor:pointer}.shell{max-width:1350px;margin:auto;padding:22px}.top{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:25px}.brand{font-size:26px;font-weight:800}.nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:12px}.nav a{padding:10px 13px;text-decoration:none;border-radius:8px;font-weight:700;color:var(--muted)}.nav a.active{background:var(--green);color:#fff}.mode{margin-left:auto}h1{margin:0 0 8px;font-size:27px}.sub{color:var(--muted);line-height:1.5;margin-bottom:22px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}.toolbar label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}select,input[type=date],input[type=number]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;min-width:125px}.toolbar button,.more{background:var(--green);color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:700}.toolbar button:disabled{opacity:.5}.status{color:var(--muted);flex:1}.burst{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 18px}.burst-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px}.burst-head h2{font-size:17px;margin:0}.burst-head small{color:var(--muted)}.burst-head a{font-weight:700}.photos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.photos a{display:block;min-width:0;border-radius:9px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}.photos img{width:100%;height:100%;object-fit:cover;display:block}.foot{text-align:center;margin:24px}.empty{padding:35px;background:var(--card);border-radius:14px;color:var(--muted)}@media(max-width:850px){.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.photos{grid-template-columns:repeat(2,1fr)}.shell{padding:13px}.nav{width:100%;flex-wrap:wrap}.mode{margin-left:0}}
.nav{flex-wrap:wrap;max-width:100%}.nav a{white-space:nowrap}.nav a:focus-visible{outline:3px solid #8acba3;outline-offset:2px}

/* CATCAM_UNIFIED_HEADER_V2 */
.shell{max-width:1510px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
.top,.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex-shrink:0}
.nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:5px;max-width:100%;width:auto;overflow:visible;justify-content:flex-end}
.mode,.dark-switch{margin-left:0;white-space:nowrap;flex-shrink:0}
@media(max-width:720px){
 .shell{padding-left:13px;padding-right:13px}
 .nav{order:2;width:100%;margin-left:0;justify-content:flex-start}
 .mode,.dark-switch{order:1;margin-left:auto}
}

</style><link rel="stylesheet" href="/catcam_header.css">
<script src="/catcam_species_names.js"></script>
</head><body><div class="shell"><header id="catcam-header" class="catcam-shared-header"></header>
<script src="/catcam_header.js"></script>
<h1>Capture Gallery</h1><p class="sub">Browse historical capture bursts, including birds and non-birds. Each burst shows its available photographs. Photos deleted by retention cleanup cannot be displayed. Unclassified historical bursts appear under All bursts.</p>
<div class="toolbar"><label>Show<select id="mode"><option value="all">All bursts</option><option value="bird">Birds only</option><option value="no_bird">No birds</option></select></label><label>Bird type<select id="type"><option value="">All bird types</option></select></label><label>From date<input id="start" type="date"></label><label>To date<input id="end" type="date"></label><label>From hour (selected timezone)<select id="fromHour"><option value="">All hours</option></select></label><label>To hour (selected timezone)<select id="toHour"><option value="">All hours</option></select></label><label>Sort<select id="order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label><button id="apply">Apply filters</button><span id="status" class="status" role="status">Loading…</span></div>
<div id="bursts"></div><div class="foot"><button id="more" class="more" hidden>Show more captures</button></div></div>
<script>
'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let page=1,total=0,busy=false;
for(let h=0;h<24;h++){const label=String(h).padStart(2,'0')+':00';$('fromHour').add(new Option(label,String(h)));$('toHour').add(new Option(label,String(h)))}
function filters(){const q=new URLSearchParams();q.set('mode',$('mode').value);q.set('order',$('order').value);q.set('page',page);for(const [key,id] of [['bird_type','type'],['start','start'],['end','end'],['start_hour','fromHour'],['end_hour','toHour']])if($(id).value)q.set(key,$(id).value);return q}
function addCard(e){const card=document.createElement('section');card.className='burst';const head=document.createElement('div');head.className='burst-head';const title=document.createElement('div');const h=document.createElement('h2');h.textContent=e.date+' '+e.event.replaceAll('-',':')+' · '+(formatCatcamSpecies(e.bird_type)||({'no_bird':'No bird detected','pending':'Pending classification','error':'Classification error'}[e.classification]||'Unclassified'));const sub=document.createElement('small');sub.textContent=e.photos.length+' available photos';title.append(h,sub);if(e.classification==='bird'){const detail=document.createElement('small');const aiDisplay=e.ai_species
                ?(e.ai_common_name
                    ?e.ai_common_name+' ('+e.ai_species+')'
                    :e.ai_species)
                :null;
                const confirmed=!!e.confirmed_species;const estimated=!!e.ai_species&&!confirmed;const score=e.ai_species_score;detail.textContent=confirmed?'✓ Confirmed species':estimated?'AIY estimate: '+aiDisplay+(score==null?'':` · ${(100*Number(score)).toFixed(1)}% confidence`)+' · Unreviewed':e.detection_engine==='local_ai'?'Bird detected · Species unidentified':'Google Vision bird classification';title.append(document.createTextNode(' · '),detail)}const link=document.createElement('a');link.href='/event?date='+encodeURIComponent(e.date)+'&event='+encodeURIComponent(e.event);link.textContent='Open burst →';head.append(title,link);const photos=document.createElement('div');photos.className='photos';for(const file of e.photos){const path=encodeURIComponent(e.date)+'/'+encodeURIComponent(e.event)+'/'+encodeURIComponent(file);const a=document.createElement('a');a.href='/event?date='+encodeURIComponent(e.date)+'&event='+encodeURIComponent(e.event)+'&photo='+encodeURIComponent(file);const img=document.createElement('img');img.src='/thumb/'+path;img.loading='lazy';img.alt='Capture '+file;img.addEventListener('error',()=>a.remove());a.append(img);photos.append(a)}card.append(head,photos);return card}
async function load(reset=false){if(busy)return;if(reset){page=1;$('bursts').replaceChildren()}if((!!$('fromHour').value)!=(!!$('toHour').value)){$('status').textContent='Select both hours or neither';return}if($('start').value&&$('end').value&&$('start').value>$('end').value){$('status').textContent='End date must be after start date';return}busy=true;$('apply').disabled=true;$('more').disabled=true;$('status').textContent='Loading captures…';try{const res=await fetch('/api/gallery?'+filters(),{cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);const chosen=$('type').value;$('type').replaceChildren(new Option('All bird types',''));for(const name of data.available_bird_types||[])$('type').add(new Option(formatCatcamSpecies(name),name));$('type').value=chosen;total=data.total;for(const e of data.events||[])$('bursts').append(addCard(e));if(reset&&!total){const p=document.createElement('p');p.className='empty';p.textContent='No matching captures with photos available.';$('bursts').append(p)}const shown=Math.min(page*data.page_size,total);$('status').textContent=`Showing ${shown} of ${total} matching bursts`;$('more').hidden=shown>=total}catch(err){$('status').textContent='Error: '+err.message;console.error(err)}finally{busy=false;$('apply').disabled=false;$('more').disabled=false}}
$('apply').addEventListener('click',()=>load(true));$('mode').addEventListener('change',()=>{if($('mode').value==='no_bird')$('type').value='';load(true)});$('type').addEventListener('change',()=>{if($('type').value)$('mode').value='bird';load(true)});$('more').addEventListener('click',()=>{page++;load()});
for(const [key,id] of [['mode','mode'],['bird_type','type'],['start','start'],['end','end'],['start_hour','fromHour'],['end_hour','toHour'],['order','order']]){const v=params.get(key);if(v!==null){if(id==='type')$('type').add(new Option(formatCatcamSpecies(v),v));$(id).value=v}}if(params.has('bird_type'))$('mode').value='bird';(async()=>{if(!params.has('mode')&&!params.has('bird_type')){try{const r=await fetch('/api/advanced-settings',{cache:'no-store'});if(r.ok){const d=await r.json();if(['all','bird','no_bird'].includes(d.settings?.gallery_default))$('mode').value=d.settings.gallery_default}}catch(e){console.warn('Gallery default unavailable',e)}}load(true)})();
</script></body></html>
