<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatCam · Capture details</title>
<style>
:root{color-scheme:light;--bg:#f3f6f5;--surface:#fff;--ink:#16251f;--muted:#64766e;--border:#dfe8e2;--green:#146b3b;--green-soft:#e7f4eb;--shadow:0 5px 22px rgba(23,54,35,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{color-scheme:dark;--bg:#111b17;--surface:#1c2922;--ink:#eef5ef;--muted:#afc0b6;--border:#35463c;--green:#57b982;--green-soft:#273e30;--shadow:none}a{color:var(--green);text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8acba3;outline-offset:3px}.shell{max-width:1510px;margin:auto;padding:20px 24px 60px}.topbar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:var(--ink)}.brand-mark{font-size:27px}.brand-name{font-size:27px;font-weight:800;letter-spacing:-1.1px}.brand-caption{color:var(--muted);border-left:1px solid var(--border);padding-left:13px}.nav{display:flex;gap:5px;background:var(--surface);padding:5px;border:1px solid var(--border);border-radius:12px}.nav a{border-radius:8px;padding:9px 15px;font-weight:650;color:var(--muted)}.nav a.active{background:var(--green);color:#fff}.top-status{color:var(--muted);font-size:12px}.dark-switch{white-space:nowrap}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}.breadcrumb a{font-weight:650}.page-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:22px}.page-head h1{margin:0 0 6px;font-size:30px;letter-spacing:-.8px}.page-head p{margin:0;color:var(--muted)}.pill{background:var(--green-soft);color:var(--green);font-weight:700;padding:8px 12px;border-radius:20px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:17px;align-items:start}.photo-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;text-align:left;color:var(--ink);padding:0}.photo-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#111}.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:650}.photo-caption small{font-weight:400;color:var(--muted)}.photo-detection{padding:0 14px 13px;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:49px}.burst-detection{margin:0 0 20px;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);line-height:1.6}.photo-card:hover{border-color:var(--green);transform:translateY(-1px)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.action{display:inline-block;padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:650}.action.primary{background:var(--green);color:#fff;border-color:var(--green)}.lightbox{position:fixed;inset:0;background:rgba(6,14,10,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:55px 70px 30px;color:#fff}.lightbox[hidden]{display:none}.lightbox img{max-height:calc(100vh - 150px);max-width:100%;object-fit:contain}.lightbox button{background:#28352d;color:#fff;border:1px solid #5c7364;border-radius:10px;padding:10px 14px}.lightbox .close{position:absolute;right:22px;top:18px}.lightbox .prev,.lightbox .next{position:absolute;top:50%;transform:translateY(-50%);font-size:26px}.lightbox .prev{left:15px}.lightbox .next{right:15px}.lightbox .foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.lightbox a{color:#b4e5c8}.lightbox .metadata{max-width:min(780px,90vw);max-height:23vh;overflow:auto;line-height:1.5;text-align:center;font-size:13px}.species-editor{margin:16px 0 20px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.species-editor h2{font-size:16px;margin:0 0 8px}.species-editor .fields{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.species-editor input{padding:9px 11px;min-width:210px;max-width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px}.species-editor button{padding:10px 13px;background:var(--green);color:#fff;border:0;border-radius:8px}.species-editor button.secondary{background:var(--green-soft);color:var(--green)}.species-editor .hint{color:var(--muted);font-size:12px;line-height:1.5}.species-editor [role=status]{margin-top:8px}.muted{color:var(--muted)}@media(max-width:720px){.shell{padding:15px 13px 35px}.brand-caption,.top-status{display:none}.topbar{gap:12px}.nav{order:2;width:100%;justify-content:space-around}.nav a{padding:10px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-caption{padding:10px}.page-head h1{font-size:23px}.lightbox{padding:60px 48px 30px}.lightbox .prev{left:5px}.lightbox .next{right:5px}}@media(max-width:370px){.photo-grid{grid-template-columns:1fr}}
.nav{flex-wrap:wrap;max-width:100%}.nav a{white-space:nowrap}.nav a:focus-visible{outline:3px solid #8acba3;outline-offset:2px}

/* CATCAM_UNIFIED_HEADER_V2 */
.shell{max-width:1510px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
.top,.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex-shrink:0}
.nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:5px;max-width:100%;width:auto;overflow:visible;justify-content:flex-end}
.mode,.dark-switch{margin-left:0;white-space:nowrap;flex-shrink:0}
@media(max-width:720px){
 .shell{padding-left:13px;padding-right:13px}
 .nav{order:2;width:100%;margin-left:0;justify-content:flex-start}
 .mode,.dark-switch{order:1;margin-left:auto}
}

</style><link rel="stylesheet" href="/catcam_header.css">
</head><body><div class="shell">
<header id="catcam-header" class="catcam-shared-header"></header>
<script src="/catcam_header.js"></script>
<div class="breadcrumb"><a href="/gallery">← Gallery</a><span>/</span><span id="crumbDate">Capture</span></div>
<div class="page-head"><div><h1 id="title">Capture details</h1><p>Six-photo burst · Select a photo to enlarge it</p></div><span class="pill" id="photoCount"></span></div>
<div class="burst-detection" id="burstDetection" role="status"></div>
<section class="species-editor" id="speciesEditor" hidden>
  <h2>Manually confirm bird species</h2>
  <p class="hint" id="speciesHint">AI species predictions are estimates until you confirm them.</p>
  <div class="fields"><input id="speciesName" type="text" maxlength="100" placeholder="e.g., Northern Cardinal" aria-label="Confirmed species name"><button id="confirmSpecies" type="button">Confirm species</button><button id="clearSpecies" class="secondary" type="button" hidden>Remove confirmation</button></div>
  <div id="speciesMessage" role="status" aria-live="polite"></div>
</section>
<div class="photo-grid" id="photoGrid"></div>
<div class="actions"><a class="action primary" href="/gallery">← Back to gallery</a><a class="action" href="/?tab=dashboard">Dashboard</a><a class="action" href="/?tab=settings">Settings</a></div>
</div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close" id="close" aria-label="Close photo">✕ Close</button><button class="prev" id="prev" aria-label="Previous photo">‹</button><img id="largePhoto" alt="Enlarged capture"><button class="next" id="next" aria-label="Next photo">›</button><div class="metadata" id="photoMetadata" role="status"></div><div class="foot"><span id="photoPosition"></span><a id="originalLink" target="_blank" rel="noopener">Open original ↗</a></div></div>
<script>
const EVENT_DATA=__CATCAM_EVENT_DATA__;
const {date,event,photos}=EVENT_DATA;
const detection=EVENT_DATA.detection||{};
function labelNames(values){return (Array.isArray(values)?values:[]).map(v=>
  typeof v==='string'?v:(v&&typeof v==='object'?String(v.name||v.description||''):'')).filter(Boolean)}
const labels=labelNames(detection.bird_labels);
const burstSummary=document.getElementById('burstDetection');
if(detection.classification==='bird'){
  const source=detection.detection_engine==='local_ai'?'Local AI (YOLO + AIY Birds)':'Google Vision';
  const chosen=detection.confirmed_species||detection.ai_species;
  const status=detection.confirmed_species?'Manually confirmed':detection.ai_species?'AIY estimate':'Unidentified';
  const score=detection.ai_species_score==null?'':` (${(100*Number(detection.ai_species_score)).toFixed(1)}% AIY confidence)`;
  burstSummary.textContent=`🐦 Bird detected in photo ${detection.first_bird_photo||'?'} · ${source}. `+
    (chosen?`${status}: ${chosen}${detection.confirmed_species?'':score}. `:'Species not identified. ')+
    (labels.length?'Detection labels: '+labels.join(', ')+'.':'');
}else if(detection.classification==='no_bird'){
  burstSummary.textContent='No bird detected. All six photos were analyzed.';
}else{
  burstSummary.textContent='Classification: '+(detection.classification||'not available')+'.';
}
const darkToggle=document.getElementById('darkToggle');
function setDark(dark){document.body.classList.toggle('dark',dark);darkToggle.checked=dark;localStorage.setItem('catcam-dark',dark?'1':'0')}
darkToggle.addEventListener('change',()=>setDark(darkToggle.checked));setDark(localStorage.getItem('catcam-dark')==='1');
document.getElementById('crumbDate').textContent=date;
document.getElementById('title').textContent=date+' · '+event.replaceAll('-',':');
document.getElementById('photoCount').textContent=photos.length+' photos';
const grid=document.getElementById('photoGrid');
const lightbox=document.getElementById('lightbox');
const largePhoto=document.getElementById('largePhoto');
let selected=0;
function photoDescription(photo){
  const result=detection.photos?.[photo.url.split('/').pop()];
  const engine=detection.detection_engine==='local_ai'?'Local AI':'Google Vision';
  const parts=[];
  if(result?.bird_detected){
    parts.push('🐦 Bird detected by '+engine);
    if(result.confidence!=null)parts.push('Detection confidence: '+(100*Number(result.confidence)).toFixed(1)+'%');
    const names=labelNames(result.labels);
    if(names.length)parts.push('Labels: '+names.join(', '));
    if(detection.confirmed_species)parts.push('Confirmed species (burst): '+detection.confirmed_species);
    else if(detection.ai_species)parts.push('AIY estimate (burst): '+detection.ai_species+(detection.ai_species_score==null?'':' · '+(100*Number(detection.ai_species_score)).toFixed(1)+'%'));
  }else if(result?.checked){parts.push('Checked · No bird detected');}
  else{parts.push('Not analyzed');}
  return parts.join(' · ');
}
function showPhoto(index){selected=(index+photos.length)%photos.length;largePhoto.src=photos[selected].url;largePhoto.alt='Capture photo '+(selected+1);document.getElementById('photoPosition').textContent='Photo '+(selected+1)+' of '+photos.length;document.getElementById('originalLink').href=photos[selected].url;document.getElementById('photoMetadata').textContent=photoDescription(photos[selected]);lightbox.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closePhoto(){lightbox.hidden=true;document.body.style.overflow='';largePhoto.removeAttribute('src')}
photos.forEach((photo,index)=>{const button=document.createElement('button');button.className='photo-card';button.type='button';button.setAttribute('aria-label','View photo '+(index+1));const img=document.createElement('img');img.src=photo.thumb;img.alt='Capture photo '+(index+1);img.loading='lazy';const caption=document.createElement('div');caption.className='photo-caption';const name=document.createElement('span');name.textContent='Photo '+(index+1);const hint=document.createElement('small');hint.textContent='Enlarge ↗';caption.append(name,hint);button.append(img,caption);
  const result=detection.photos?.[photo.url.split('/').pop()];
  const detail=document.createElement('div');detail.className='photo-detection';
  if(result?.bird_detected){
    detail.textContent=photoDescription(photo);
  }else if(result?.checked){
    detail.textContent='Checked · No bird detected';
  }else if(detection.classification==='bird'){
    detail.textContent='Not analyzed · Burst preserved';
  }else{
    detail.textContent='Not analyzed';
  }
  button.append(detail);button.addEventListener('click',()=>showPhoto(index));grid.appendChild(button)});
// The Gallery passes ?photo=NN.jpg so the chosen thumbnail opens directly in the viewer.
const requestedPhoto=new URLSearchParams(location.search).get('photo');
if(requestedPhoto){const index=photos.findIndex(p=>p.url.split('/').pop()===requestedPhoto);if(index>=0)showPhoto(index)}

// Manual review changes species metadata only; it does not alter the AIY prediction.
if(detection.classification==='bird'){
  const editor=document.getElementById('speciesEditor');editor.hidden=false;
  const name=document.getElementById('speciesName');
  const message=document.getElementById('speciesMessage');
  const clear=document.getElementById('clearSpecies');
  name.value=detection.confirmed_species||detection.ai_species||'';
  clear.hidden=!detection.confirmed_species;
  document.getElementById('speciesHint').textContent=detection.confirmed_species?
    'Confirmed: '+detection.confirmed_species+'. You can correct or remove this identification.':
    (detection.ai_species?'AIY estimate: '+detection.ai_species+'. Confirm or correct it after reviewing the photos.':'Enter the species you identified in these photos.');
  async function saveSpecies(species){
    const confirm=document.getElementById('confirmSpecies');
    confirm.disabled=true;clear.disabled=true;message.textContent='Saving…';
    try{
      const res=await fetch('/api/species-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,event,species})});
      const data=await res.json();if(!res.ok)throw Error(data.message||'Could not save');
      detection.confirmed_species=data.confirmed_species;
      detection.species_status=data.species_status;
      clear.hidden=!data.confirmed_species;
      name.value=data.confirmed_species||detection.ai_species||'';
      message.textContent=data.confirmed_species?'✓ Species confirmed: '+data.confirmed_species:'Confirmation removed. AIY estimate retained.';
      document.getElementById('speciesHint').textContent=data.confirmed_species?'Manually confirmed: '+data.confirmed_species:'Not manually confirmed.';
      if(detection.classification==='bird'){
        const source=detection.detection_engine==='local_ai'?'Local AI':'Google Vision';
        burstSummary.textContent='🐦 Bird detected · '+source+' · '+(data.confirmed_species?'Confirmed species: '+data.confirmed_species:detection.ai_species?'AIY estimate: '+detection.ai_species:'Species unidentified');
      }
      if(!lightbox.hidden)document.getElementById('photoMetadata').textContent=photoDescription(photos[selected]);
    }catch(err){message.textContent='Error: '+err.message}
    finally{confirm.disabled=false;clear.disabled=false}
  }
  document.getElementById('confirmSpecies').addEventListener('click',()=>saveSpecies(name.value.trim()));
  clear.addEventListener('click',()=>saveSpecies(null));
}
document.getElementById('close').addEventListener('click',closePhoto);
document.getElementById('prev').addEventListener('click',()=>showPhoto(selected-1));
document.getElementById('next').addEventListener('click',()=>showPhoto(selected+1));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});
document.addEventListener('keydown',e=>{if(lightbox.hidden)return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(selected-1);if(e.key==='ArrowRight')showPhoto(selected+1)});
</script></body></html>
