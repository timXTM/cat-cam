<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{color-scheme:light;--bg:#f3f6f5;--surface:#fff;--ink:#16251f;--muted:#64766e;--border:#dfe8e2;--green:#146b3b;--green-soft:#e7f4eb;--shadow:0 5px 22px rgba(23,54,35,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{color-scheme:dark;--bg:#111b17;--surface:#1c2922;--ink:#eef5ef;--muted:#afc0b6;--border:#35463c;--green:#57b982;--green-soft:#273e30;--shadow:none}a{color:var(--green);text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8acba3;outline-offset:3px}.shell{max-width:1510px;margin:auto;padding:20px 24px 60px}.topbar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:var(--ink)}.brand-mark{font-size:27px}.brand-name{font-size:27px;font-weight:800;letter-spacing:-1.1px}.brand-caption{color:var(--muted);border-left:1px solid var(--border);padding-left:13px}.nav{display:flex;gap:5px;background:var(--surface);padding:5px;border:1px solid var(--border);border-radius:12px}.nav a{border-radius:8px;padding:9px 15px;font-weight:650;color:var(--muted)}.nav a.active{background:var(--green);color:#fff}.top-status{color:var(--muted);font-size:12px}.dark-switch{white-space:nowrap}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}.breadcrumb a{font-weight:650}.page-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:22px}.page-head h1{margin:0 0 6px;font-size:30px;letter-spacing:-.8px}.page-head p{margin:0;color:var(--muted)}.pill{background:var(--green-soft);color:var(--green);font-weight:700;padding:8px 12px;border-radius:20px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:17px;align-items:start}.photo-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;text-align:left;color:var(--ink);padding:0}.photo-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#111}.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:650}.photo-caption small{font-weight:400;color:var(--muted)}.photo-detection{padding:0 14px 22px;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:49px}.burst-detection{margin:0 0 20px;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);line-height:1.6}.photo-card:hover{border-color:var(--green);transform:translateY(-1px)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.action{display:inline-block;padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:650}.action.primary{background:var(--green);color:#fff;border-color:var(--green)}.lightbox{position:fixed;inset:0;background:rgba(6,14,10,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:55px 70px 30px;color:#fff}.lightbox[hidden]{display:none}.lightbox img{max-height:calc(100vh - 150px);max-width:100%;object-fit:contain}.lightbox button{background:#28352d;color:#fff;border:1px solid #5c7364;border-radius:10px;padding:10px 14px}.lightbox .close{position:absolute;right:22px;top:18px}.lightbox .prev,.lightbox .next{position:absolute;top:50%;transform:translateY(-50%);font-size:26px}.lightbox .prev{left:15px}.lightbox .next{right:15px}.lightbox .foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.lightbox a{color:#b4e5c8}.lightbox .metadata{max-width:min(780px,90vw);max-height:23vh;overflow:auto;line-height:1.5;text-align:center;font-size:13px}.species-editor{margin:16px 0 20px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.species-editor h2{font-size:16px;margin:0 0 8px}.species-editor .fields{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.species-editor input{padding:9px 11px;min-width:210px;max-width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px}.species-editor button{padding:10px 13px;background:var(--green);color:#fff;border:0;border-radius:8px}.species-editor button.secondary{background:var(--green-soft);color:var(--green)}.species-editor .hint{color:var(--muted);font-size:12px;line-height:1.5}.species-editor [role=status]{margin-top:8px}.muted{color:var(--muted)}@media(max-width:720px){.shell{padding:15px 13px 35px}.brand-caption,.top-status{display:none}.topbar{gap:12px}.nav{order:2;width:100%;justify-content:space-around}.nav a{padding:10px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-caption{padding:10px}.page-head h1{font-size:23px}.lightbox{padding:60px 48px 30px}.lightbox .prev{left:5px}.lightbox .next{right:5px}}@media(max-width:370px){.photo-grid{grid-template-columns:1fr}}
.nav{flex-wrap:wrap;max-width:100%}.nav a{white-space:nowrap}.nav a:focus-visible{outline:3px solid #8acba3;outline-offset:2px}

/* CATCAM_UNIFIED_HEADER_V2 */
.shell{max-width:1510px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
.top,.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{flex-shrink:0}
.nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:5px;max-width:100%;width:auto;overflow:visible;justify-content:flex-end}
.mode,.dark-switch{margin-left:0;white-space:nowrap;flex-shrink:0}
@media(max-width:720px){
 .shell{padding-left:13px;padding-right:13px}
 .nav{order:2;width:100%;margin-left:0;justify-content:flex-start}
 .mode,.dark-switch{order:1;margin-left:auto}
}


/* Full-resolution photo zoom and pan */
.lightbox .photo-viewport {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  cursor: zoom-in;
}

.lightbox .photo-viewport.zoomed {
  cursor: grab;
}

.lightbox .photo-viewport.dragging {
  cursor: grabbing;
}

.lightbox .photo-viewport img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
  will-change: transform;
}

.lightbox .metadata,
.lightbox .foot {
  flex-shrink: 0;
}

.lightbox .prev,
.lightbox .next,
.lightbox .close {
  z-index: 2;
}

</style><link rel="stylesheet" href="/catcam_header.css">
</head><body><div class="shell">
<header id="catcam-header" class="catcam-shared-header"></header>
<script src="/catcam_header.js"></script>
<div class="breadcrumb"><a href="/gallery">← Gallery</a><span>/</span><span id="crumbDate">Capture</span></div>
<div class="page-head"><div><h1 id="title">Capture details</h1><p>Six-photo burst · Select a photo to enlarge it</p></div><span class="pill" id="photoCount"></span></div>
<div class="burst-detection" id="burstDetection" role="status"></div>
<section class="species-editor" id="speciesEditor" hidden>
  <h2>Manually confirm bird species</h2>
  <p class="hint" id="speciesHint">AI species predictions are estimates until you confirm them.</p>
  <div class="fields"><input id="speciesName" type="text" list="speciesOptions" maxlength="100" placeholder="e.g., Northern Cardinal" aria-label="Confirmed species name"><button id="confirmSpecies" type="button">Confirm species</button><button id="clearSpecies" class="secondary" type="button" hidden>Remove confirmation</button></div>
  <datalist id="speciesOptions"></datalist>
  <div style="margin-top:10px">
    <button id="addSpeciesButton" class="secondary" type="button">
      + Add new species
    </button>
  </div>
  <div id="newSpeciesForm" hidden style="margin-top:12px">
    <label for="newSpeciesName">New species (common English name)</label>
    <div class="fields">
      <input id="newSpeciesName" type="text" maxlength="100"
             placeholder="e.g., Carolina wren">
      <button id="saveNewSpecies" type="button">Save new species</button>
      <button id="cancelNewSpecies" class="secondary" type="button">Cancel</button>
    </div>
  </div>
  <div id="speciesMessage" role="status" aria-live="polite"></div>
</section>
<div class="photo-grid" id="photoGrid"></div>
<div class="actions"><a class="action primary" href="/gallery">← Back to gallery</a><a class="action" href="/?tab=dashboard">Dashboard</a><a class="action" href="/?tab=settings">Settings</a></div>
</div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close" id="close" aria-label="Close photo">✕ Close</button><button class="prev" id="prev" aria-label="Previous photo">‹</button><div class="photo-viewport" id="photoViewport"><img id="largePhoto" alt="Enlarged capture" draggable="false"></div><button class="next" id="next" aria-label="Next photo">›</button><div class="metadata" id="photoMetadata" role="status"></div><div class="foot"><span id="photoPosition"></span><a id="originalLink" target="_blank" rel="noopener">Open original ↗</a></div></div>
<script>
const EVENT_DATA=__CATCAM_EVENT_DATA__;
const {date,event,photos}=EVENT_DATA;
const detection=EVENT_DATA.detection||{};
function labelNames(values){return (Array.isArray(values)?values:[]).map(v=>
  typeof v==='string'?v:(v&&typeof v==='object'?String(v.name||v.description||''):'')).filter(Boolean)}
const labels=labelNames(detection.bird_labels);
function aiName(){
  if(!detection.ai_species)return null;
  return detection.ai_common_name
    ? detection.ai_common_name+' ('+detection.ai_species+')'
    : detection.ai_species;
}
const burstSummary=document.getElementById('burstDetection');
if(detection.classification==='bird'){
  const source=detection.detection_engine==='local_ai'?'Local AI (YOLO + AIY Birds)':'Google Vision';
  const chosen=detection.confirmed_species||aiName();
  const status=detection.confirmed_species?'Manually confirmed':detection.ai_species?'AIY estimate':'Unidentified';
  const score=detection.ai_species_score==null?'':` (${(100*Number(detection.ai_species_score)).toFixed(1)}% AIY confidence)`;
  burstSummary.textContent=`🐦 Bird detected in photo ${detection.first_bird_photo||'?'} · ${source}. `+
    (chosen?`${status}: ${chosen}${detection.confirmed_species?'':score}. `:'Species not identified. ')+
    (detection.detection_engine==='google_vision'&&labels.length?'Google Vision labels: '+labels.join(', ')+'.':'');
}else if(detection.classification==='no_bird'){
  burstSummary.textContent='No bird detected. All six photos were analyzed.';
}else{
  burstSummary.textContent='Classification: '+(detection.classification||'not available')+'.';
}
document.getElementById('crumbDate').textContent=date;
document.getElementById('title').textContent=date+' · '+event.replaceAll('-',':');

async function loadDisplayTimezone(){
  try{
    const response=await fetch('/api/advanced-settings',{cache:'no-store'});
    if(!response.ok)throw Error('Settings unavailable');
    const data=await response.json();
    const timezone=data.settings?.timezone||'America/New_York';
    if(EVENT_DATA.captured_at){
      const formatted=new Intl.DateTimeFormat('en-US',{
        timeZone:timezone,dateStyle:'medium',timeStyle:'short'
      }).format(new Date(EVENT_DATA.captured_at));
      document.getElementById('title').textContent=formatted;
      document.getElementById('crumbDate').textContent=formatted;
    }
  }catch(error){
    console.warn('Using original capture folder time:',error);
  }
}
loadDisplayTimezone();
document.getElementById('photoCount').textContent=photos.length+' photos';
const grid=document.getElementById('photoGrid');
const lightbox=document.getElementById('lightbox');
const largePhoto=document.getElementById('largePhoto');
let selected=0;

const photoViewport=document.getElementById('photoViewport');

let zoom=1;
let panX=0;
let panY=0;
let dragPointer=null;
let dragStartX=0;
let dragStartY=0;
let dragOriginX=0;
let dragOriginY=0;
let dragged=false;
let suppressClick=false;

function panLimits(){
  const viewport=photoViewport.getBoundingClientRect();

  // offsetWidth/offsetHeight are unaffected by CSS transforms.
  // This keeps the pan limits stable while the photo is moving.
  const imageWidth=largePhoto.offsetWidth;
  const imageHeight=largePhoto.offsetHeight;

  return {
    x:Math.max(0,(imageWidth*zoom-viewport.width)/2),
    y:Math.max(0,(imageHeight*zoom-viewport.height)/2)
  };
}

function applyPhotoTransform(){
  const limits=panLimits();
  panX=Math.max(-limits.x,Math.min(limits.x,panX));
  panY=Math.max(-limits.y,Math.min(limits.y,panY));

  largePhoto.style.transform=
    `translate(${panX}px,${panY}px) scale(${zoom})`;

  photoViewport.classList.toggle('zoomed',zoom>1);
}

function resetPhotoZoom(){
  if(dragPointer!==null){
    try{photoViewport.releasePointerCapture(dragPointer)}catch(error){}
  }

  zoom=1;
  panX=0;
  panY=0;
  dragPointer=null;
  dragged=false;
  suppressClick=false;

  photoViewport.classList.remove('zoomed','dragging');
  largePhoto.style.transform='';
}

function togglePhotoZoom(){
  if(zoom>1){
    resetPhotoZoom();
    return;
  }

  zoom=2;
  panX=0;
  panY=0;
  applyPhotoTransform();
}

photoViewport.addEventListener('pointerdown',event=>{
  if(zoom<=1||event.button!==0)return;

  dragPointer=event.pointerId;
  dragStartX=event.clientX;
  dragStartY=event.clientY;
  dragOriginX=panX;
  dragOriginY=panY;
  dragged=false;

  photoViewport.setPointerCapture(event.pointerId);
});

photoViewport.addEventListener('pointermove',event=>{
  if(dragPointer!==event.pointerId)return;

  const dx=event.clientX-dragStartX;
  const dy=event.clientY-dragStartY;

  if(Math.hypot(dx,dy)>5){
    dragged=true;
    photoViewport.classList.add('dragging');
  }

  if(!dragged)return;

  panX=dragOriginX+dx;
  panY=dragOriginY+dy;
  applyPhotoTransform();
});

function endPhotoDrag(event){
  if(dragPointer!==event.pointerId)return;

  if(dragged)suppressClick=true;

  dragPointer=null;
  dragged=false;
  photoViewport.classList.remove('dragging');

  if(photoViewport.hasPointerCapture(event.pointerId)){
    photoViewport.releasePointerCapture(event.pointerId);
  }
}

photoViewport.addEventListener('pointerup',endPhotoDrag);
photoViewport.addEventListener('pointercancel',endPhotoDrag);

photoViewport.addEventListener('click',()=>{
  if(suppressClick){
    suppressClick=false;
    return;
  }
  togglePhotoZoom();
});

photoViewport.addEventListener('wheel',event=>{
  if(zoom<=1)return;

  event.preventDefault();

  const movement=event.deltaMode===1?16:
    event.deltaMode===2?photoViewport.clientHeight:1;

  if(event.shiftKey){
    panX-=event.deltaY*movement;
    panX-=event.deltaX*movement;
  }else{
    panY-=event.deltaY*movement;
    panX-=event.deltaX*movement;
  }

  applyPhotoTransform();
},{passive:false});

window.addEventListener('resize',()=>{
  if(!lightbox.hidden&&zoom>1)applyPhotoTransform();
});

function photoDescription(photo){
  const result=detection.photos?.[photo.url.split('/').pop()];
  const engine=detection.detection_engine==='local_ai'?'Local AI':'Google Vision';
  const parts=[];
  if(result?.bird_detected){
    parts.push('🐦 Bird detected by '+engine);
    if(result.confidence!=null)parts.push('Detection confidence: '+(100*Number(result.confidence)).toFixed(1)+'%');
    const names=labelNames(result.labels);
    if(names.length&&detection.detection_engine!=='local_ai')parts.push('Google Vision labels: '+names.join(', '));
    if(detection.confirmed_species)parts.push('Confirmed species (burst): '+detection.confirmed_species);
    else if(detection.ai_species)parts.push('AIY estimate: '+aiName()+(detection.ai_species_score==null?'':' · '+(100*Number(detection.ai_species_score)).toFixed(1)+'% AIY confidence'));
  }else if(result?.checked){parts.push('Checked · No bird detected');}
  else{parts.push('Not analyzed');}
  return parts.join(' · ');
}
function showPhoto(index){resetPhotoZoom();selected=(index+photos.length)%photos.length;largePhoto.src=photos[selected].url;largePhoto.alt='Capture photo '+(selected+1);document.getElementById('photoPosition').textContent='Photo '+(selected+1)+' of '+photos.length;document.getElementById('originalLink').href=photos[selected].url;document.getElementById('photoMetadata').textContent=photoDescription(photos[selected]);lightbox.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closePhoto(){resetPhotoZoom();lightbox.hidden=true;document.body.style.overflow='';largePhoto.removeAttribute('src')}
photos.forEach((photo,index)=>{const button=document.createElement('button');button.className='photo-card';button.type='button';button.setAttribute('aria-label','View photo '+(index+1));const img=document.createElement('img');img.src=photo.thumb;img.alt='Capture photo '+(index+1);img.loading='lazy';const caption=document.createElement('div');caption.className='photo-caption';const name=document.createElement('span');name.textContent='Photo '+(index+1);const hint=document.createElement('small');hint.textContent='Enlarge ↗';caption.append(name,hint);button.append(img,caption);
  const result=detection.photos?.[photo.url.split('/').pop()];
  const detail=document.createElement('div');detail.className='photo-detection';
  if(result?.bird_detected){
    detail.textContent=photoDescription(photo);
  }else if(result?.checked){
    detail.textContent='Checked · No bird detected';
  }else if(detection.classification==='bird'){
    detail.textContent='Not analyzed · Burst preserved';
  }else{
    detail.textContent='Not analyzed';
  }
  button.append(detail);button.addEventListener('click',()=>showPhoto(index));grid.appendChild(button)});
// The Gallery passes ?photo=NN.jpg so the chosen thumbnail opens directly in the viewer.
const requestedPhoto=new URLSearchParams(location.search).get('photo');
if(requestedPhoto){const index=photos.findIndex(p=>p.url.split('/').pop()===requestedPhoto);if(index>=0)showPhoto(index)}

// Manual review changes species metadata only; it does not alter the AIY prediction.
if(detection.classification==='bird'){
  const editor=document.getElementById('speciesEditor');editor.hidden=false;
  const name=document.getElementById('speciesName');
   const speciesOptions=document.getElementById('speciesOptions');
   let availableSpecies=[];
   const confirmButton=document.getElementById('confirmSpecies');
   confirmButton.disabled=true;
   fetch('/api/species-options')
     .then(response=>{
       if(!response.ok)throw Error('Species list unavailable');
       return response.json();
     })
     .then(data=>{
       availableSpecies=data.species||[];
       if(!availableSpecies.length)throw Error('Species list is empty');
       confirmButton.disabled=false;
       for(const species of availableSpecies){
         const option=document.createElement('option');
         option.value=species;
         speciesOptions.appendChild(option);
       }
     })
     .catch(error=>{
       console.warn(error);
       confirmButton.disabled=true;
       message.textContent='Species list unavailable. Please reload the page.';
     });
  const message=document.getElementById('speciesMessage');

   const addButton=document.getElementById('addSpeciesButton');
   const newForm=document.getElementById('newSpeciesForm');
   const newName=document.getElementById('newSpeciesName');
   const saveNew=document.getElementById('saveNewSpecies');
   const cancelNew=document.getElementById('cancelNewSpecies');

   addButton.addEventListener('click',()=>{
     newForm.hidden=false;
     newName.value='';
     newName.focus();
   });

   cancelNew.addEventListener('click',()=>{
     newForm.hidden=true;
     newName.value='';
   });

   saveNew.addEventListener('click',async()=>{
     const species=newName.value.trim();

     if(!species){
       message.textContent='Enter a species name.';
       return;
     }

     saveNew.disabled=true;
     message.textContent='Adding species…';

     try{
       const response=await fetch('/api/species-add',{
         method:'POST',
         headers:{'Content-Type':'application/json'},
         body:JSON.stringify({species})
       });

       const result=await response.json();

       if(!response.ok){
         throw Error(result.message||'Could not add species');
       }

       const saved=result.species;

       if(!availableSpecies.some(
         item=>item.toLowerCase()===saved.toLowerCase()
       )){
         availableSpecies.push(saved);
         availableSpecies.sort((a,b)=>a.localeCompare(b));

         const option=document.createElement('option');
         option.value=saved;
         speciesOptions.appendChild(option);
       }

       name.value=saved;
       confirmButton.disabled=false;
       newForm.hidden=true;

       message.textContent=result.added
         ?'✓ New species added. Click Confirm species to apply it.'
         :'Species already exists. Click Confirm species to apply it.';

     }catch(error){
       message.textContent='Error: '+error.message;
     }finally{
       saveNew.disabled=false;
     }
   });
  const clear=document.getElementById('clearSpecies');
  name.value=detection.confirmed_species||detection.ai_species||'';
  clear.hidden=!detection.confirmed_species;
  document.getElementById('speciesHint').textContent=detection.confirmed_species?
    'Confirmed: '+detection.confirmed_species+'. You can correct or remove this identification.':
    (detection.ai_species?'AIY estimate: '+aiName()+'. Confirm or correct it after reviewing the photos.':'Enter the species you identified in these photos.');
  async function saveSpecies(species){
     if(species){
       const selected=availableSpecies.find(
         item=>item.toLowerCase()===species.toLowerCase()
       );
       if(!selected){
         message.textContent='Select a species from the suggested list.';
         return;
       }
       if(selected)species=selected;
     }
    const confirm=document.getElementById('confirmSpecies');
    confirm.disabled=true;clear.disabled=true;message.textContent='Saving…';
    try{
      const res=await fetch('/api/species-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,event,species})});
      const data=await res.json();if(!res.ok)throw Error(data.message||'Could not save');
      detection.confirmed_species=data.confirmed_species;
      detection.species_status=data.species_status;
      clear.hidden=!data.confirmed_species;
      name.value=data.confirmed_species||detection.ai_species||'';
      message.textContent=data.confirmed_species?'✓ Species confirmed: '+data.confirmed_species:'Confirmation removed. AIY estimate retained.';
      document.getElementById('speciesHint').textContent=data.confirmed_species?'Manually confirmed: '+data.confirmed_species:'Not manually confirmed.';
      if(detection.classification==='bird'){
        const source=detection.detection_engine==='local_ai'?'Local AI':'Google Vision';
        burstSummary.textContent='🐦 Bird detected · '+source+' · '+(data.confirmed_species?'Confirmed species: '+data.confirmed_species:detection.ai_species?'AIY estimate: '+aiName():'Species unidentified');
      }
      if(!lightbox.hidden)document.getElementById('photoMetadata').textContent=photoDescription(photos[selected]);
    }catch(err){message.textContent='Error: '+err.message}
    finally{confirm.disabled=false;clear.disabled=false}
  }
  document.getElementById('confirmSpecies').addEventListener('click',()=>saveSpecies(name.value.trim()));
  clear.addEventListener('click',()=>saveSpecies(null));
}
document.getElementById('close').addEventListener('click',closePhoto);
document.getElementById('prev').addEventListener('click',()=>showPhoto(selected-1));
document.getElementById('next').addEventListener('click',()=>showPhoto(selected+1));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});
document.addEventListener('keydown',e=>{if(lightbox.hidden)return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(selected-1);if(e.key==='ArrowRight')showPhoto(selected+1)});
</script></body></html>
