<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatCam · Capture details</title>
<style>
:root{color-scheme:light;--bg:#f3f6f5;--surface:#fff;--ink:#16251f;--muted:#64766e;--border:#dfe8e2;--green:#146b3b;--green-soft:#e7f4eb;--shadow:0 5px 22px rgba(23,54,35,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{color-scheme:dark;--bg:#111b17;--surface:#1c2922;--ink:#eef5ef;--muted:#afc0b6;--border:#35463c;--green:#57b982;--green-soft:#273e30;--shadow:none}a{color:var(--green);text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8acba3;outline-offset:3px}.shell{max-width:1510px;margin:auto;padding:20px 24px 60px}.topbar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:var(--ink)}.brand-mark{font-size:27px}.brand-name{font-size:27px;font-weight:800;letter-spacing:-1.1px}.brand-caption{color:var(--muted);border-left:1px solid var(--border);padding-left:13px}.nav{display:flex;gap:5px;background:var(--surface);padding:5px;border:1px solid var(--border);border-radius:12px}.nav a{border-radius:8px;padding:9px 15px;font-weight:650;color:var(--muted)}.nav a.active{background:var(--green);color:#fff}.top-status{color:var(--muted);font-size:12px}.dark-switch{white-space:nowrap}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}.breadcrumb a{font-weight:650}.page-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:22px}.page-head h1{margin:0 0 6px;font-size:30px;letter-spacing:-.8px}.page-head p{margin:0;color:var(--muted)}.pill{background:var(--green-soft);color:var(--green);font-weight:700;padding:8px 12px;border-radius:20px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:17px}.photo-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;text-align:left;color:var(--ink);padding:0}.photo-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#111}.photo-caption{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:650}.photo-caption small{font-weight:400;color:var(--muted)}.photo-card:hover{border-color:var(--green);transform:translateY(-1px)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.action{display:inline-block;padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:650}.action.primary{background:var(--green);color:#fff;border-color:var(--green)}.lightbox{position:fixed;inset:0;background:rgba(6,14,10,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:55px 70px 30px;color:#fff}.lightbox[hidden]{display:none}.lightbox img{max-height:calc(100vh - 150px);max-width:100%;object-fit:contain}.lightbox button{background:#28352d;color:#fff;border:1px solid #5c7364;border-radius:10px;padding:10px 14px}.lightbox .close{position:absolute;right:22px;top:18px}.lightbox .prev,.lightbox .next{position:absolute;top:50%;transform:translateY(-50%);font-size:26px}.lightbox .prev{left:15px}.lightbox .next{right:15px}.lightbox .foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.lightbox a{color:#b4e5c8}.muted{color:var(--muted)}@media(max-width:720px){.shell{padding:15px 13px 35px}.brand-caption,.top-status{display:none}.topbar{gap:12px}.nav{order:2;width:100%;justify-content:space-around}.nav a{padding:10px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-caption{padding:10px}.page-head h1{font-size:23px}.lightbox{padding:60px 48px 30px}.lightbox .prev{left:5px}.lightbox .next{right:5px}}@media(max-width:370px){.photo-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell">
<header class="topbar"><a class="brand" href="/?tab=dashboard"><span class="brand-mark">◉</span><span class="brand-name">CatCam</span><span class="brand-caption">Wildlife Dashboard</span></a><nav class="nav" aria-label="Main navigation"><a href="/?tab=dashboard">Dashboard</a><a class="active" href="/?tab=gallery" aria-current="page">Gallery</a><a href="/?tab=settings">Settings</a></nav><div class="top-status">● Capture archive</div><label class="dark-switch"><input id="darkToggle" type="checkbox"> Dark mode</label></header>
<div class="breadcrumb"><a href="/?tab=gallery">← Gallery</a><span>/</span><span id="crumbDate">Capture</span></div>
<div class="page-head"><div><h1 id="title">Capture details</h1><p>Six-photo burst · Select a photo to enlarge it</p></div><span class="pill" id="photoCount"></span></div>
<div class="photo-grid" id="photoGrid"></div>
<div class="actions"><a class="action primary" href="/?tab=gallery">← Back to gallery</a><a class="action" href="/?tab=dashboard">Dashboard</a><a class="action" href="/?tab=settings">Settings</a></div>
</div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close" id="close" aria-label="Close photo">✕ Close</button><button class="prev" id="prev" aria-label="Previous photo">‹</button><img id="largePhoto" alt="Enlarged capture"><button class="next" id="next" aria-label="Next photo">›</button><div class="foot"><span id="photoPosition"></span><a id="originalLink" target="_blank" rel="noopener">Open original ↗</a></div></div>
<script>
const EVENT_DATA=__CATCAM_EVENT_DATA__;
const {date,event,photos}=EVENT_DATA;
const darkToggle=document.getElementById('darkToggle');
function setDark(dark){document.body.classList.toggle('dark',dark);darkToggle.checked=dark;localStorage.setItem('catcam-dark',dark?'1':'0')}
darkToggle.addEventListener('change',()=>setDark(darkToggle.checked));setDark(localStorage.getItem('catcam-dark')==='1');
document.getElementById('crumbDate').textContent=date;
document.getElementById('title').textContent=date+' · '+event.replaceAll('-',':');
document.getElementById('photoCount').textContent=photos.length+' photos';
const grid=document.getElementById('photoGrid');
const lightbox=document.getElementById('lightbox');
const largePhoto=document.getElementById('largePhoto');
let selected=0;
function showPhoto(index){selected=(index+photos.length)%photos.length;largePhoto.src=photos[selected].url;largePhoto.alt='Capture photo '+(selected+1);document.getElementById('photoPosition').textContent='Photo '+(selected+1)+' of '+photos.length;document.getElementById('originalLink').href=photos[selected].url;lightbox.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closePhoto(){lightbox.hidden=true;document.body.style.overflow='';largePhoto.removeAttribute('src')}
photos.forEach((photo,index)=>{const button=document.createElement('button');button.className='photo-card';button.type='button';button.setAttribute('aria-label','View photo '+(index+1));const img=document.createElement('img');img.src=photo.url;img.alt='Capture photo '+(index+1);img.loading='lazy';const caption=document.createElement('div');caption.className='photo-caption';const name=document.createElement('span');name.textContent='Photo '+(index+1);const hint=document.createElement('small');hint.textContent='Enlarge ↗';caption.append(name,hint);button.append(img,caption);button.addEventListener('click',()=>showPhoto(index));grid.appendChild(button)});
document.getElementById('close').addEventListener('click',closePhoto);
document.getElementById('prev').addEventListener('click',()=>showPhoto(selected-1));
document.getElementById('next').addEventListener('click',()=>showPhoto(selected+1));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto()});
document.addEventListener('keydown',e=>{if(lightbox.hidden)return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')showPhoto(selected-1);if(e.key==='ArrowRight')showPhoto(selected+1)});
</script></body></html>
